<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-pop 데이터 대시보드</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%237c6cff%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27 font-weight=%27bold%27%3EK%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo">K</div>
    <div>
      <div class="brand-title">K-pop 데이터 대시보드</div>
      <div class="brand-sub">투어 · 소셜 · 시상식 · 아티스트 · 산업 모델</div>
    </div>
  </div>
  <div class="meta">
    <div class="asof"><span class="muted">데이터 기준일</span> <b id="asOf">불러오는 중…</b></div>
    <div class="src-state" id="srcState"></div>
    <button class="btn ghost" id="themeBtn" title="테마 전환">◐</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="overview" class="active">개요</button>
  <button data-tab="boxscore">투어 박스스코어</button>
  <button data-tab="tracker">투어 트래커</button>
  <button data-tab="social">소셜</button>
  <button data-tab="events">시상식·이벤트</button>
  <button data-tab="artists">아티스트·브랜드</button>
  <button data-tab="auditions">오디션</button>
  <button data-tab="rpd">랜덤플레이댄스</button>
  <button data-tab="industry">산업 모델</button>
</nav>

<section class="accbar" id="accBar">
  <span class="accbar-label">정확도 필터</span>
  <div class="accchips" id="accChips"></div>
  <div class="accbar-right">
    <span class="legend-est"><i class="sw sw-solid"></i>확인값 <i class="sw sw-hatch"></i>추정치 <i class="sw sw-dash"></i>미정·추정 구간</span>
    <button class="btn ghost small" id="accAll">전체</button>
    <button class="btn ghost small" id="accVerified">검증만</button>
  </div>
</section>

<main id="main">
  <div class="loading" id="loading"><div class="spinner"></div>데이터 불러오는 중…</div>
  <section class="tab-panel active" id="tab-overview"></section>
  <section class="tab-panel" id="tab-boxscore"></section>
  <section class="tab-panel" id="tab-tracker"></section>
  <section class="tab-panel" id="tab-social"></section>
  <section class="tab-panel" id="tab-events"></section>
  <section class="tab-panel" id="tab-artists"></section>
  <section class="tab-panel" id="tab-auditions"></section>
  <section class="tab-panel" id="tab-rpd"></section>
  <section class="tab-panel" id="tab-industry"></section>
</main>

<footer class="foot">
  <div>데이터: <a href="https://gaeco76.github.io/kpop-research/" target="_blank" rel="noopener">gaeco76/kpop-research</a> (매주 월요일 갱신) · 차트: Apache ECharts · 수치는 원본 JSON을 실시간으로 불러와 표시합니다(가공·추가 수치 없음, 파생값은 ‘계산’ 표기).</div>
  <div id="footSrc" class="muted"></div>
</footer>

<div id="tip" class="floating-tip" hidden></div>

<script>window.ECHARTS_CDN='https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js';</script>
<script src="vendor/echarts.min.js"></script>
<script>if(!window.echarts){document.write('<script src="'+window.ECHARTS_CDN+'"><\/script>');}</script>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/tabs.js"></script>
<script src="js/calendar.js"></script>
<script src="js/app.js"></script>
</body>
</html>
